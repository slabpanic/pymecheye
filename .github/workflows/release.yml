name: Publish source release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build source distribution
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: false
      - name: Install release tools
        run: uv sync --locked --only-group release
      - name: Verify release tag
        run: |
          uv run --no-sync --only-group release python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          from packaging.version import Version

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = str(Version(project["version"]))
          if project["name"] != "pymecheye":
              raise SystemExit("The distribution name must be pymecheye")
          if project["version"] != version:
              raise SystemExit(f"Use the normalized project version: {version}")
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} does not match project version v{version}")
          PY
      - name: Build source distribution
        run: uv build --sdist --no-sources
      - name: Validate source distribution
        run: |
          uv run --no-sync --only-group release python .github/scripts/check_sdist.py dist/*.tar.gz
          uv run --no-sync --only-group release twine check --strict dist/*.tar.gz
      - name: Save source distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  ci:
    name: Verify release
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml

  publish:
    name: Upload source distribution to PyPI
    needs: [build, ci]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pymecheye/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-sdist
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*.tar.gz
