name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  PYTHONFAULTHANDLER: "1"

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.13t", "3.14t"]
        include:
          - os: windows-2022
            python: "3.10"
          - os: windows-2022
            python: "3.14"
          - os: windows-2022
            python: "3.14t"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "MSVC x64 build tools were not found" }
          & "$vsPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Set up external SDK
        shell: bash
        run: uv run --no-project python .github/scripts/setup_sdk.py --destination "$RUNNER_TEMP/mech-eye-sdk"
      - name: Build and install
        run: uv sync --locked --no-editable
      - name: Check dependencies
        run: uv pip check
      - name: Check formatting
        run: uv run --no-sync black --check --workers 1 src/mecheye examples tests .github/scripts docs
      - name: Verify installation from the source distribution
        if: runner.os == 'Linux' && matrix.python == '3.10'
        shell: bash
        run: |
          uv build --sdist
          uv run --no-sync python .github/scripts/check_sdist.py dist/*.tar.gz
          uv pip install --force-reinstall --no-deps dist/*.tar.gz
      - name: Run unit tests
        run: uv run --no-sync python -B -m unittest discover -s tests -v

  coverage:
    name: Python and C++ coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
      - name: Set up external SDK
        run: uv run --no-project python .github/scripts/setup_sdk.py --destination "$RUNNER_TEMP/mech-eye-sdk"
      - name: Build with native coverage
        run: >-
          uv sync --locked --no-editable --group test --group native-coverage
          --no-build-isolation-package pymecheye
          -Ccmake.define.MECHEYE_ENABLE_COVERAGE=ON -Cbuild-dir=build/coverage
      - name: Run tests with Python branch coverage
        run: uv run --no-sync coverage run -m unittest discover -s tests -v
      - name: Write Python coverage
        if: always()
        run: |
          uv run --no-sync coverage xml
          uv run --no-sync coverage report --fail-under=95
      - name: Write native coverage
        if: always()
        run: >-
          uv run --no-sync gcovr --root . --filter 'src/mecheye/' --merge-lines
          --xml-pretty --output coverage-native.xml --print-summary --fail-under-line=80 build/coverage
      - name: Save coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: coverage-*.xml
          if-no-files-found: error
      - name: Upload Python coverage to Codecov
        if: >-
          success() && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-python.xml
          flags: python
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
      - name: Upload native coverage to Codecov
        if: >-
          success() && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-native.xml
          flags: native
          disable_search: true
          plugins: noop
          fail_ci_if_error: true

  docs:
    name: Sphinx documentation
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Set up external SDK
        run: uv run --no-project python .github/scripts/setup_sdk.py --destination "$RUNNER_TEMP/mech-eye-sdk"
      - name: Install binding and documentation dependencies
        run: uv sync --locked --no-editable --no-default-groups --group docs
      - name: Check Chinese translation catalogs
        run: |
          uv run --no-sync sphinx-build -n -W --keep-going -b gettext docs docs/_build/gettext
          uv run --no-sync python docs/_ext/check_translations.py docs/_build/gettext
      - name: Build documentation with warnings as errors
        run: |
          uv run --no-sync sphinx-build -n -W --keep-going -b html -D language=en docs docs/_build/en
          uv run --no-sync sphinx-build -n -W --keep-going -b html -D language=zh_CN docs docs/_build/zh_CN
      - name: Save documentation preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sphinx-html
          path: |
            docs/_build/en
            docs/_build/zh_CN
          if-no-files-found: warn
