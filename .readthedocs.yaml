version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - g++
    - libgomp1
  jobs:
    post_create_environment:
      - python -m pip install "uv>=0.9,<0.13"
    pre_install:
      - python .github/scripts/setup_sdk.py --destination /tmp/pymecheye-sdk
    install:
      - >-
        MECHEYE_SDK_ROOT=/tmp/pymecheye-sdk/payload/opt/mech-mind/mech-eye-sdk
        CMAKE_BUILD_PARALLEL_LEVEL=2 UV_PROJECT_ENVIRONMENT="$READTHEDOCS_VIRTUALENV_PATH"
        uv sync --locked --inexact --no-default-groups --group docs --no-editable
        --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python"
    build:
      html:
        - >-
          MECHEYE_SDK_ROOT=/tmp/pymecheye-sdk/payload/opt/mech-mind/mech-eye-sdk
          python -m sphinx -n -W --keep-going -b html docs "$READTHEDOCS_OUTPUT/html"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
