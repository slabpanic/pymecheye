[build-system]
requires = ["scikit-build-core>=0.11,<0.12", "nanobind>=3.1,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "pymecheye"
version = "0.1.0"
description = "High-performance nanobind bindings and NumPy utilities for Mech-Eye 3D cameras, compatible with mecheyeapi"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND BSD-3-Clause"
keywords = ["mecheye", "nanobind", "3d-camera", "point-cloud", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["numpy>=2.0"]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/mecheye/licenses/*/*"]

[project.urls]
Homepage = "https://github.com/slabpanic/pymecheye"
Repository = "https://github.com/slabpanic/pymecheye"
Issues = "https://github.com/slabpanic/pymecheye/issues"
Documentation = "https://pymecheye.readthedocs.io/en/latest/"

[dependency-groups]
dev = ["black>=26.5.1"]
test = ["coverage[toml]>=7.13,<8"]
release = ["packaging>=24,<27", "twine>=6,<7"]
docs = ["sphinx>=7.4,<9", "furo>=2024.8.6,<2027"]
native-coverage = [
    "gcovr>=8.6,<9",
    "nanobind>=3.1,<4",
    "scikit-build-core>=0.11,<0.12",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/mecheye"]
wheel.exclude = ["**/__pycache__/**", "mecheye/*.cpp", "mecheye/*.h"]
sdist.include = [
    "/CMakeLists.txt",
    "/cmake/**",
    "/src/mecheye/*.py",
    "/src/mecheye/*.pyi",
    "/src/mecheye/*.cpp",
    "/src/mecheye/*.h",
    "/src/mecheye/licenses/*/*",
    "/README.md",
    "/README.zh-CN.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/examples/*.py",
    "/tests/*.py",
    "/tests/*.json",
    "/.gitattributes",
    "/docs/*.rst",
    "/docs/conf.py",
    "/docs/api/index.rst",
    "/docs/_ext/*.py",
    "/docs/_templates/autosummary/*.rst",
    "/docs/_templates/*.html",
    "/docs/locale/*/LC_MESSAGES/*.po",
]
sdist.exclude = ["src/sdk/**", "**/__pycache__/**", "**/*.pyc", "docs/_build/**", "docs/api/_generated/**", "docs/locale/**/*.mo"]
install.strip = false

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cmake/**" },
    { file = "src/mecheye/*.py" },
    { file = "src/mecheye/*.pyi" },
    { file = "src/mecheye/*.cpp" },
    { file = "src/mecheye/*.h" },
    { file = "src/mecheye/licenses/*/*" },
    { file = "README.md" },
    { env = "MECHEYE_SDK_ROOT" },
]

[tool.black]
target-version = ["py310"]

[tool.coverage.run]
branch = true
source = ["mecheye"]
relative_files = true
concurrency = ["thread"]

[tool.coverage.paths]
mecheye = [
    "src/mecheye",
    "*/site-packages/mecheye",
    "*\\site-packages\\mecheye",
]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.xml]
output = "coverage-python.xml"
